<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.5-fpm.sock|fcgi://localhost"
    </FilesMatch>

    <Proxy "unix:/run/php/php8.5-fpm.sock|fcgi://localhost">
        ProxySet timeout=70
    </Proxy>

    <Directory /var/www/html/public/build>
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresDefault "access plus 1 year"
        </IfModule>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    ServerSignature Off
    Header unset X-Powered-By

    ErrorLog /dev/stderr

    SetEnvIf Request_URI "^/up$" dontlog
    SetEnvIf Request_URI "^/\.well-known/openid-configuration$" dontlog
    CustomLog /dev/stdout combined env=!dontlog
</VirtualHost>
