# Identity provider — port 443. This is the vhost that serves the app.
#
# Install to /etc/apache2/sites-available/auth_irongateenterprises_com-le-ssl.conf
#
# Reverse proxy. The application is a container published to 127.0.0.1:8001 by
# production.compose.yaml. This vhost terminates TLS and forwards plain HTTP over
# loopback. It holds no DocumentRoot, reads no application file, and never invokes
# a PHP handler — which is what keeps it independent of the mod_php 7.4 this same
# Apache still loads for app.irongateenterprises.com.
#
# Required modules: ssl, headers, proxy, proxy_http.
#   sudo a2enmod ssl headers proxy proxy_http
# NOT proxy_fcgi — FastCGI happens inside the container.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName auth.irongateenterprises.com
    ServerAdmin webmaster@irongateenterprises.com

    # The canonical access log for this site. The container's own Apache has its
    # access log off deliberately: it would record the docker bridge address,
    # where this one records the true client IP.
    ErrorLog ${APACHE_LOG_DIR}/auth-idp-error.log
    CustomLog ${APACHE_LOG_DIR}/auth-idp-access.log combined
    LogLevel warn

    # --- TLS --------------------------------------------------------------
    # SSLEngine on is stated explicitly even though options-ssl-apache.conf also
    # sets it. Without it the connection still negotiates TLS via the default
    # :443 vhost, but this server block does not consider itself SSL, so every
    # absolute redirect Apache builds comes out http://.
    SSLEngine on

    # certbot updates this in place; do not inline the settings.
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/auth.irongateenterprises.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/auth.irongateenterprises.com/privkey.pem

    # --- Host guard -------------------------------------------------------
    # Catches a client that reached this vhost via SNI but sent a different Host.
    # Laravel builds absolute URLs from the request host — password reset, email
    # verification, and OIDC redirect URIs, which are matched by exact string —
    # and trustProxies(at: '*') is set with TrustHosts disabled. This is the only
    # thing between a poisoned Host and those URLs.
    <Location "/">
        Require expr %{HTTP_HOST} =~ /^auth\.irongateenterprises\.com(:[0-9]+)?$/i
    </Location>

    # --- Security headers -------------------------------------------------
    # setifempty: the application sets its own (SetSecurityHeaders) and those
    # always win. These cover responses Apache generates itself — above all the
    # host guard's 403, which never reaches the container.
    #
    # DENY, not SAMEORIGIN: nothing may frame an identity provider's login or
    # consent screens, including this origin.
    Header always setifempty X-Content-Type-Options "nosniff"
    Header always setifempty X-Frame-Options        "DENY"
    Header always setifempty Referrer-Policy        "strict-origin-when-cross-origin"

    # Enabled here, unlike tools.*, where it is still commented pending renewal
    # confirmation. This host holds everyone's password; downgrade protection is
    # worth more than the ability to quietly fall back to http. It cannot be
    # called back by editing this file — max-age binds every browser that has
    # loaded the page. No includeSubDomains: it would bind names under auth.*
    # that do not exist yet.
    Header always set Strict-Transport-Security "max-age=31536000"

    # --- Forwarded headers ------------------------------------------------
    # Inlined deliberately. tools.* switches posture through a symlinked Include
    # because it may sit behind a CDN; this host has exactly one proxy hop and
    # will not grow an edge tier, and a symlink whose wrong target silently
    # disables the login throttle is not worth the indirection.
    #
    # unset first, because mod_proxy APPENDS to an existing X-Forwarded-For
    # rather than replacing it, and Laravel with trustProxies(at: '*') believes
    # the leftmost value. Without this a client sends its own header and picks
    # its own IP, which defeats every IP-keyed rate limit — including the login
    # throttle, on the host that authenticates every account in the company.
    RequestHeader unset X-Forwarded-For

    # Same reasoning: a forged X-Forwarded-Host would poison the absolute URLs
    # above. ProxyPreserveHost passes the real Host through instead.
    RequestHeader unset X-Forwarded-Host

    # set, not setifempty: this must overwrite whatever the client sent. TLS
    # terminates here, so the container only sees plain HTTP and has no other way
    # to know the request was https. Without it Laravel generates http:// URLs
    # and the secure session cookie never sticks.
    RequestHeader set X-Forwarded-Proto "https"

    # --- Reverse proxy to the container -----------------------------------
    # Required, not optional: without it Apache rewrites Host to 127.0.0.1:8001
    # and Laravel builds every absolute URL against loopback.
    ProxyPreserveHost On

    # Outermost rung of the ladder, innermost-shortest so the layer that knows
    # why a request hung gives up first:
    #
    #   php-fpm    request_terminate_timeout  60   (logs the script and line)
    #   container  ProxySet timeout           70
    #   host       this directive             80
    #
    # Far shorter than tools.*'s 320: nothing here spawns a subprocess inside a
    # request. Raising this alone does nothing; the inner layers cut first.
    ProxyPass        / http://127.0.0.1:8001/ timeout=80
    ProxyPassReverse / http://127.0.0.1:8001/
</VirtualHost>
</IfModule>
