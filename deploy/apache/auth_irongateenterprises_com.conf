# Identity provider — port 80. Redirect-only; the app is served by the :443 vhost.
#
# Install to /etc/apache2/sites-available/auth_irongateenterprises_com.conf
#
# Serves nothing from disk. It exists to refuse a forged Host and to bounce http
# to https. Without it, http://auth.… falls through to whichever vhost happens to
# be Apache's default for *:80.
#
# No ACME webroot: certificates come from certbot's dns-digitalocean plugin
# (DNS-01), so Apache is never in the validation path.

<VirtualHost *:80>
    ServerName auth.irongateenterprises.com
    ServerAdmin webmaster@irongateenterprises.com

    # No DocumentRoot. Every request is either refused by the host guard or
    # redirected, both before any file lookup.

    ErrorLog ${APACHE_LOG_DIR}/auth-idp-error.log
    CustomLog ${APACHE_LOG_DIR}/auth-idp-access.log combined
    LogLevel warn

    RewriteEngine On

    # Refuse a Host that is not the canonical name, before the redirect, so a bad
    # Host gets 403 rather than a redirect that leaks the canonical name.
    #
    # The optional (:[0-9]+) is not decoration: `Host: auth.…:80` is legal and an
    # anchored match without it would 403 a valid request.
    RewriteCond %{HTTP_HOST} !^auth\.irongateenterprises\.com(:[0-9]+)?$ [NC]
    RewriteRule ^ - [F,L]

    RewriteRule ^ https://auth.irongateenterprises.com%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
